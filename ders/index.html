<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matematik ve Yapay Zeka Portalı</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1e3a8a;
            color: white;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .orientation-warning h2 { font-size: 24px; margin-bottom: 15px; }
        .orientation-warning p { font-size: 18px; }
        .rotate-icon { font-size: 60px; margin: 20px 0; animation: rotate 2s infinite; }
        @keyframes rotate {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        @media (orientation: portrait) {
            .orientation-warning { display: flex !important; }
            body > *:not(.orientation-warning) { display: none !important; }
        }
        @media (orientation: landscape) and (max-width: 900px) {
            .bg-slate-900 { min-h-[50px] !important; height: auto !important; padding: 4px 2vw !important; }
            .iframe-container { flex: 1 !important; height: 0 !important; }
            h1 { font-size: 14px !important; }
            button { padding: 6px 10px !important; font-size: 11px !important; }
            .hidden { display: none !important; }
        }
        body {
            font-family: 'Segoe UI', system-ui, Arial, sans-serif;
            background-color: #f1f5f9;
            overflow: hidden; /* Portal dışı taşmaları engeller */
        }
        .iframe-container {
            flex: 1;
            height: 0; /* Prevents overflow computation bugs in some browsers */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #f8fafc;
        }
    </style>
</head>
<body class="flex flex-col h-screen select-none">
    <div class="orientation-warning">
        <h2>📱 Lütfen Cihazınızı Yatay Konuma Getirin</h2>
        <div class="rotate-icon">🔄</div>
        <p>Bu içerik yatay (landscape) modda görüntülenmek üzere tasarlanmıştır.</p>
    </div>

    <div class="bg-slate-900 text-white min-h-[70px] py-2 px-6 flex items-center justify-between shadow-md z-50">
        <div class="flex items-center gap-4">
            <span class="text-2xl" id="portalIcon">🚀</span>
            <div>
                <h1 class="font-bold text-base sm:text-lg leading-normal" id="portalTitle">Canlı Ders Portalı</h1>
                <p class="text-xs text-slate-400">Modül <span id="currentNum">1</span> / <span id="totalNum">9</span></p>
            </div>
        </div>

        <div class="hidden lg:flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
            <button onclick="goToSlide(1)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-1">Giriş</button>
            <button onclick="goToSlide(2)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-2">Problem</button>
            <button onclick="goToSlide(3)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-3">YZ Rehberi</button>
            <button onclick="goToSlide(4)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-4">Prompt</button>
            <button onclick="goToSlide(5)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-5">Sosyal Ağ Lab</button>
            <button onclick="goToSlide(6)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-6">GYİ Simülatörü</button>
            <button onclick="goToSlide(7)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-7">Matematiksel İspat</button>
            <button onclick="goToSlide(8)" class="slide-tab-btn px-3 py-1.5 text-xs font-semibold rounded-md transition-all" id="tab-8">R(3,3,3)</button>
           
        </div>

        <div class="flex items-center gap-3">
            <button id="prevSlideBtn" onclick="changeSlide(-1)" class="bg-slate-700 hover:bg-slate-600 active:scale-95 disabled:opacity-30 disabled:pointer-events-none px-4 py-2 rounded-lg font-bold text-sm transition-all flex items-center gap-1 cursor-pointer">
                ⬅ Geri
            </button>
            <button id="nextSlideBtn" onclick="changeSlide(1)" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 disabled:opacity-30 disabled:pointer-events-none px-4 py-2 rounded-lg font-bold text-sm transition-all flex items-center gap-1 cursor-pointer">
                İleri ➡
            </button>
            
                        <div class="h-6 w-[1px] bg-slate-700 mx-1 hidden sm:block"></div>
            
            <!-- YZ Araçları Dropdown -->
            <div class="relative" id="aiDropdown">
                <button onclick="toggleAiDropdown(event)" class="bg-indigo-900 hover:bg-indigo-800 border border-indigo-500 px-3 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 cursor-pointer text-indigo-100">
                    <span>✨ YZ Araçları</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-down opacity-70" viewBox="0 0 16 16">
                      <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                    </svg>
                </button>
                <div id="aiDropdownMenu" class="absolute right-0 top-full mt-2 w-48 bg-slate-800 border border-slate-700 rounded-lg shadow-xl opacity-0 invisible transition-all duration-200 transform origin-top-right scale-95 z-50">
                    <div class="p-2 flex flex-col gap-1">
                        <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" class="px-3 py-2 text-sm text-slate-200 hover:text-white hover:bg-slate-700 rounded-md transition-colors flex items-center gap-2">
                            <span class="text-green-500 text-lg">●</span> ChatGPT
                        </a>
                        <a href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer" class="px-3 py-2 text-sm text-slate-200 hover:text-white hover:bg-slate-700 rounded-md transition-colors flex items-center gap-2">
                            <span class="text-blue-400 text-lg">●</span> Google Gemini
                        </a>
                        <a href="https://claude.ai/" target="_blank" rel="noopener noreferrer" class="px-3 py-2 text-sm text-slate-200 hover:text-white hover:bg-slate-700 rounded-md transition-colors flex items-center gap-2">
                            <span class="text-amber-500 text-lg">●</span> Claude AI
                        </a>
                        <hr class="border-slate-700 my-1">
                        <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer" class="px-3 py-2 text-sm text-slate-200 hover:text-white hover:bg-slate-700 rounded-md transition-colors flex items-center gap-2">
                            <span class="text-purple-400 text-lg">●</span> Google AI Studio
                        </a>
                    </div>
                </div>
            </div>

            <div class="h-6 w-[1px] bg-slate-700 mx-1 hidden sm:block"></div>
            <button id="fullscreenBtn" onclick="toggleFullscreen()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-lg text-sm transition-all flex items-center gap-1 cursor-pointer" title="Slayt Modu (Tam Ekran)">
                📺 <span class="hidden sm:inline" id="fsBtnText">Tam Ekran</span>
            </button>
        </div>
    </div>

    <div class="iframe-container w-full flex-1">
        <iframe id="portalFrame" src="intro.html" title="Presentation Container"></iframe>
    </div>

    <script>
        const slides = [
            { file: "intro.html", title: "Canlı Ders Portalı: Giriş", icon: "🚀" },
            { file: "slayt1.html", title: "Ramsey'in Parti Problemi", icon: "🎈" },
            { file: "slayt2.html", title: "Yapay Zekayı Düşünme Ortağı Yapmak", icon: "🤖" },
            { file: "slayt3.html", title: "Etkili Çıktı İçin Prompt", icon: "💻" },
            { file: "slayt4.html", title: "Çizge Laboratuvarı: Sosyal Ağ Simülasyonu", icon: "🕸️" },
            { file: "slayt7.html", title: "Güvercin Yuvası Prensibi Simülatörü", icon: "🕊️" },
            { file: "slayt6.html", title: "Ramsey Teoremi: R(3,3)=6 İspat Adımları", icon: "📐" },
            { file: "slayt9.html", title: "Yeni Bir Boyut: R(3,3,3) Problemi", icon: "🎭" },
            { file: "slayt5.html", title: "Sınıf İçi Güvercin Yuvası İlkesi Örneği", icon: "🐦" }
        ];

        let currentSlideIndex = 0;
        const totalSlides = slides.length;

        const iframe = document.getElementById('portalFrame');
        const titleEl = document.getElementById('portalTitle');
        const iconEl = document.getElementById('portalIcon');
        const currentNumEl = document.getElementById('currentNum');
        const totalNumEl = document.getElementById('totalNum');
        const prevBtn = document.getElementById('prevSlideBtn');
        const nextBtn = document.getElementById('nextSlideBtn');
        const fsBtnText = document.getElementById('fsBtnText');

        totalNumEl.innerText = totalSlides;
        updatePortalUI();

        function changeSlide(direction) {
            currentSlideIndex += direction;
            if (currentSlideIndex < 0) currentSlideIndex = 0;
            if (currentSlideIndex >= totalSlides) currentSlideIndex = totalSlides - 1;
            loadSlide();
        }

        function goToSlide(slideNumber) {
            currentSlideIndex = slideNumber - 1;
            loadSlide();
        }

        function loadSlide() {
            const currentSlide = slides[currentSlideIndex];
            iframe.src = currentSlide.file;
            updatePortalUI();
        }

        function updatePortalUI() {
            const currentSlide = slides[currentSlideIndex];
            titleEl.innerText = currentSlide.title;
            iconEl.innerText = currentSlide.icon;
            currentNumEl.innerText = currentSlideIndex + 1;

            prevBtn.disabled = (currentSlideIndex === 0);
            nextBtn.disabled = (currentSlideIndex === totalSlides - 1);

            document.querySelectorAll('.slide-tab-btn').forEach((btn, idx) => {
                if (idx === currentSlideIndex) {
                    btn.classList.remove('text-slate-400', 'hover:text-white');
                    btn.classList.add('bg-indigo-600', 'text-white', 'shadow-sm');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-sm');
                    btn.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-700/50');
                }
            });
        }

        // TAM EKRAN (POWERPOINT MODU) YÖNETİMİ
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                // Tarayıcıyı tam ekrana geçirir
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Tam ekran moduna geçilemedi: ${err.message}`);
                });
            } else {
                // Tam ekrandan çıkarır
                document.exitFullscreen();
            }
        }

        // YZ Menüsünü Açıp Kapatan Fonksiyon
        function toggleAiDropdown(event) {
            event.stopPropagation();
            const menu = document.getElementById('aiDropdownMenu');

            menu.classList.toggle('opacity-0');
            menu.classList.toggle('invisible');
            menu.classList.toggle('scale-95');
            menu.classList.toggle('opacity-100');
            menu.classList.toggle('visible');
            menu.classList.toggle('scale-100');
        }

        // Ekranda başka bir yere tıklandığında menünün otomatik kapanması için
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('aiDropdownMenu');
            const dropdown = document.getElementById('aiDropdown');

            if (menu && dropdown && !dropdown.contains(e.target)) {
                menu.classList.add('opacity-0', 'invisible', 'scale-95');
                menu.classList.remove('opacity-100', 'visible', 'scale-100');
            }
        });

        // Tarayıcının orijinal tam ekran değişimlerini yakalayıp butonu güncelleme
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsBtnText.innerText = "Pencere Modu";
            } else {
                fsBtnText.innerText = "Tam Ekran";
            }
        });

        // Klavye Kontrolleri
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowRight' || e.key === 'Space') {
                // Boşluk tuşu veya Sağ ok ile ileri
                if (currentSlideIndex < totalSlides - 1) {
                    e.preventDefault();
                    changeSlide(1);
                }
            } else if (e.key === 'ArrowLeft') {
                // Sol ok ile geri
                if (currentSlideIndex > 0) changeSlide(-1);
            }
        });
    </script>
</body>
</html>
