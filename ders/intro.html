<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş: Atölye Çalışması</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #f1f5f9 0%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5vh 2.5vw;
        }

        .slide-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 8vh 6vw;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        /* Dekoratif Arka Plan Elemanları */
        .decor {
            position: absolute;
            z-index: -1;
            opacity: 0.1;
        }
        .decor-1 { top: -10%; left: -10%; font-size: 200px; transform: rotate(-15deg); }
        .decor-2 { bottom: -10%; right: -10%; font-size: 200px; transform: rotate(15deg); }

        .hero-section {
            margin-bottom: 8vh;
            max-width: 900px;
        }

        .subtitle {
            font-size: clamp(32px, 5vw, 56px);
            color: #0f172a;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -2px;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .feature-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .feature-item {
            background-color: #ffffff;
            padding: 25px 35px;
            border-radius: 24px;
            border: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 25px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            text-align: left;
        }

        .feature-item:hover {
            transform: scale(1.03) translateX(10px);
            border-color: #3b82f6;
            box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.1);
        }

        .feature-icon-wrapper {
            background: #eff6ff;
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }

        .feature-item:hover .feature-icon-wrapper {
            background: #3b82f6;
            color: white;
        }

        .feature-text {
            display: flex;
            flex-direction: column;
        }

        .feature-title {
            font-weight: 800;
            font-size: 22px;
            color: #1e3a8a;
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
        }

        .footer-note {
            margin-top: 8vh;
            font-size: 18px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .slide-card { padding: 40px 20px; border-radius: 24px; }
            .feature-item { padding: 20px; flex-direction: column; text-align: center; }
            .feature-item:hover { transform: scale(1.03); }
            .feature-icon-wrapper { width: 60px; height: 60px; font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="slide-card">
        <div class="decor decor-1">🕸️</div>
        <div class="decor decor-2">🤖</div>

        <div class="hero-section">
            <h2 class="subtitle">Ramsey'in Parti Problemi ve Yapay Zeka ile Matematiksel Keşif </h2>
        </div>

        <div class="feature-column">
            <div class="feature-item">
                <div class="feature-icon-wrapper">🕸️</div>
                <div class="feature-text">
                    <span class="feature-title">Graf Teorisi</span>
                    <span class="feature-desc">Sosyal ağları ve karmaşık yapıları görselleştirme</span>
                </div>
            </div>
            
            <div class="feature-item">
                <div class="feature-icon-wrapper">🐦</div>
                <div class="feature-text">
                    <span class="feature-title">Güvercin Yuvası İlkesi</span>
                    <span class="feature-desc">Matematiksel ispatların en zarif ve güçlü aracı</span>
                </div>
            </div>
            
            <div class="feature-item">
                <div class="feature-icon-wrapper">🤖</div>
                <div class="feature-text">
                    <span class="feature-title">Yapay Zeka</span>
                    <span class="feature-desc">Düşünme ortağı olarak AI ile yeni çözümler keşfetme</span>
                </div>
            </div>
        </div>

        
    </div>

</body>
</html>
